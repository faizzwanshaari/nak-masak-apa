<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nak Masak Apa? 🐱</title>
<meta name="theme-color" content="#ffb3c6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f7; --card:#ffffff; --ink:#2b2730; --muted:#8a8294;
  --pink:#ff8fab; --pink-soft:#ffd6e2; --mint:#b8f2e6; --yellow:#ffe066;
  --line:#2b2730;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(var(--pink-soft) 2px,transparent 2px);background-size:26px 26px;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
#app{max-width:480px;margin:0 auto;padding:16px 16px 0}
h1{font-size:28px;font-weight:800;margin:6px 0 2px;line-height:1.1}
h2{font-size:22px;font-weight:800;margin:4px 0 12px}
p{margin:0}
.sub{color:var(--muted);font-size:16px;margin-bottom:14px}

/* Cute cards with chunky outline */
.card{
  background:var(--card);border:3px solid var(--line);border-radius:22px;
  box-shadow:0 5px 0 var(--line);padding:14px;margin-bottom:14px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:inherit;font-weight:800;font-size:18px;color:var(--ink);
  background:var(--pink);border:3px solid var(--line);border-radius:999px;
  box-shadow:0 5px 0 var(--line);padding:12px 22px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;width:100%;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--mint)}
.btn.yellow{background:var(--yellow)}
.btn.ghost{background:#fff;width:auto}
.btn.small{font-size:15px;padding:8px 14px;width:auto}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);
  padding:16px 8px;text-align:center;font:inherit;font-weight:800;font-size:17px;color:var(--ink);cursor:pointer;
  transition:transform .08s,box-shadow .08s;
}
.tile .e{display:block;font-size:40px;margin-bottom:4px}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile.sel{background:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:#fff;
  border:3px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;
}
.chip.sel{background:var(--pink)}
.crumbs{display:flex;gap:6px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.crumbs span.on{color:var(--ink);font-weight:800}

.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.dish-name{font-weight:800;font-size:18px}
.meta{font-size:14px;color:var(--muted)}
.heart{font:inherit;font-size:26px;background:none;border:0;cursor:pointer;padding:4px}

.yoshi{display:block;margin:0 auto;object-fit:cover;object-position:50% 30%;border-radius:50%;border:4px solid var(--line);box-shadow:0 5px 0 var(--line);background:#fff;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero{text-align:center;padding:6px 0 2px}
.bubble{
  display:inline-block;background:#fff;border:3px solid var(--line);border-radius:18px;
  padding:8px 14px;font-weight:700;margin-top:6px;position:relative;
}

.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty .yoshi{margin-bottom:10px}

/* Spin overlay */
.overlay{position:fixed;inset:0;background:rgba(43,39,48,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay .card{width:100%;max-width:340px;text-align:center}
.spin-name{font-size:26px;font-weight:800;min-height:40px;margin:8px 0}
.spin-emoji{font-size:64px;line-height:1.1}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* Ingredient rows */
.ing{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--pink-soft);font-size:17px}
.ing:last-child{border-bottom:0}
.ing input{width:22px;height:22px;accent-color:var(--pink)}
.steps{line-height:1.5;font-size:17px}

/* Bottom nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:40;
  max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;
}
.nav button{
  flex:1;font:inherit;font-weight:800;font-size:14px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;
}
.nav button .i{font-size:24px}
.nav button.on{color:var(--ink);background:var(--pink-soft)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tiny{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav">
  <button data-tab="pilih"><span class="i">🐾</span>Pilih</button>
  <button data-tab="kegemaran"><span class="i">💖</span>Kegemaran</button>
  <button data-tab="senarai"><span class="i">🛒</span>Senarai</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- DATA ---------- */
const PROTEIN=[
  {k:'ayam',label:'Ayam',e:'🍗'},
  {k:'daging',label:'Daging',e:'🥩'},
  {k:'ikan',label:'Ikan',e:'🐟'},
  {k:'seafood',label:'Seafood',e:'🦐'},
  {k:'telur',label:'Telur',e:'🥚'},
  {k:'sayur',label:'Sayur',e:'🥬'}
];
const STYLE=['Kering','Berkuah','Goreng','Bakar','Tumis'];
const TIME=[
  {k:'cepat',label:'Cepat',desc:'bawah 15 min',test:m=>m<=15},
  {k:'sederhana',label:'Sederhana',desc:'15 – 40 min',test:m=>m>15&&m<=40},
  {k:'lama',label:'Sempat lama',desc:'lebih 40 min',test:m=>m>40}
];
const MENU=[
  {id:'ayam-masak-merah',n:'Ayam Masak Merah',e:'🍗',p:'ayam',s:'Berkuah',m:30,ing:['Ayam 1 ekor','Cili kering','Bawang merah & putih','Halia & bawang putih','Tomato 2 biji','Sos tomato','Garam & gula'],st:'Tumis rempah sampai naik minyak. Masukkan ayam, tomato dan sos. Masak sampai ayam empuk dan kuah pekat.'},
  {id:'ayam-goreng-berempah',n:'Ayam Goreng Berempah',e:'🍗',p:'ayam',s:'Goreng',m:40,ing:['Ayam 1 ekor','Serbuk kari','Serbuk cili','Bawang putih','Halia','Tepung jagung'],st:'Perap ayam dengan rempah 30 min. Goreng api sederhana sampai masak dan rangup.'},
  {id:'ayam-bakar',n:'Ayam Bakar',e:'🍢',p:'ayam',s:'Bakar',m:45,ing:['Ayam 1 ekor','Kicap','Sos cili','Asam jawa','Bawang putih','Gula melaka'],st:'Perap ayam dengan kicap dan rempah. Bakar atau panggang sambil sapu sos sampai garing.'},
  {id:'ayam-kicap',n:'Ayam Kicap',e:'🍗',p:'ayam',s:'Tumis',m:15,ing:['Ayam potong dadu','Kicap manis','Bawang besar','Bawang putih','Cili hijau'],st:'Tumis bawang dan bawang putih. Masukkan ayam, kicap, dan cili. Kacau sampai sebati.'},
  {id:'kari-ayam',n:'Kari Ayam',e:'🍛',p:'ayam',s:'Berkuah',m:40,ing:['Ayam','Serbuk kari','Kentang 2 biji','Santan','Bawang besar','Daun kari'],st:'Tumis bawang dan serbuk kari. Masukkan ayam dan kentang. Tuang santan, masak sampai kentang lembut.'},
  {id:'rendang-daging',n:'Rendang Daging',e:'🥘',p:'daging',s:'Kering',m:120,ing:['Daging 500g','Santan','Cili kering','Serai','Lengkuas','Daun limau purut','Asam keping'],st:'Rebus daging dengan rempah dan santan. Kacau perlahan sampai kering dan berminyak.'},
  {id:'daging-lada-hitam',n:'Daging Lada Hitam',e:'🥩',p:'daging',s:'Tumis',m:25,ing:['Daging hiris','Lada hitam','Bawang besar','Bawang putih','Kicap cair','Sos tiram'],st:'Perap daging dengan kicap. Tumis bawang dan lada hitam, masukkan daging dan sos tiram.'},
  {id:'sup-tulang',n:'Sup Tulang',e:'🍲',p:'daging',s:'Berkuah',m:90,ing:['Tulang lembu','Lobak merah','Kentang','Bawang putih','Halia','Daun sup'],st:'Rebus tulang 1 jam sambil buang buih. Masukkan sayur dan rempah, masak sampai lembut.'},
  {id:'daging-kicap',n:'Daging Kicap',e:'🥩',p:'daging',s:'Tumis',m:20,ing:['Daging hiris','Kicap','Bawang besar','Cili padi','Bawang putih'],st:'Tumis bawang dan bawang putih. Masukkan daging, kicap dan cili. Masak sampai daging empuk.'},
  {id:'ikan-goreng-berempah',n:'Ikan Goreng Berempah',e:'🐟',p:'ikan',s:'Goreng',m:20,ing:['Ikan kembung 2 ekor','Serbuk kunyit','Garam','Serbuk cili','Minyak'],st:'Lumurkan ikan dengan rempah. Goreng dalam minyak panas sampai rangup kedua-dua belah.'},
  {id:'asam-pedas-ikan',n:'Asam Pedas Ikan',e:'🐠',p:'ikan',s:'Berkuah',m:30,ing:['Ikan 500g','Asam jawa','Cili kering','Bawang merah','Tomato','Serai','Bendi'],st:'Tumis rempah. Masukkan air asam, tomato dan serai. Masak sebentar, kemudian masukkan ikan dan bendi.'},
  {id:'ikan-bakar',n:'Ikan Bakar',e:'🐟',p:'ikan',s:'Bakar',m:25,ing:['Ikan 2 ekor','Cili kering','Bawang merah','Asam jawa','Garam','Kunyit'],st:'Lumurkan ikan dengan sambal. Bakar atas api sederhana sambil sapu minyak.'},
  {id:'ikan-lemak-cili-api',n:'Ikan Masak Lemak Cili Api',e:'🐡',p:'ikan',s:'Berkuah',m:25,ing:['Ikan 500g','Santan','Cili api','Kunyit','Asam keping','Daun kesum'],st:'Tumis rempah sampai wangi. Tuang santan dan air, masukkan ikan dan asam. Masak perlahan.'},
  {id:'sotong-goreng-tepung',n:'Sotong Goreng Tepung',e:'🦑',p:'seafood',s:'Goreng',m:15,ing:['Sotong 300g','Tepung gandum','Tepung jagung','Garam','Serbuk lada','Minyak'],st:'Potong sotong dan salut dengan tepung. Goreng dalam minyak panas sampai keemasan.'},
  {id:'udang-masak-sambal',n:'Udang Masak Sambal',e:'🦐',p:'seafood',s:'Tumis',m:15,ing:['Udang 300g','Sambal tumis','Bawang besar','Daun limau purut','Gula'],st:'Tumis sambal sampai pecah minyak. Masukkan udang dan kacau sampai masak.'},
  {id:'telur-dadar',n:'Telur Dadar',e:'🍳',p:'telur',s:'Goreng',m:8,ing:['Telur 3 biji','Bawang besar','Cili padi','Garam','Minyak'],st:'Pukul telur dengan bawang dan cili. Goreng dalam minyak panas sampai masak.'},
  {id:'telur-balado',n:'Telur Balado',e:'🥚',p:'telur',s:'Tumis',m:12,ing:['Telur rebus 4 biji','Cili merah','Bawang besar','Tomato','Gula'],st:'Belah telur dan goreng sekejap. Tumis sambal balado, masukkan telur.'},
  {id:'sayur-campur',n:'Sayur Campur',e:'🥗',p:'sayur',s:'Tumis',m:10,ing:['Kobis','Carrot','Taugeh','Bawang putih','Kicap','Garam'],st:'Tumis bawang putih. Masukkan sayur, kacau cepat dengan api besar. Perisakan dan angkat.'},
  {id:'kangkung-belacan',n:'Kangkung Belacan',e:'🌿',p:'sayur',s:'Tumis',m:8,ing:['Kangkung 1 ikat','Belacan','Cili padi','Bawang putih','Minyak'],st:'Tumis bawang putih dan belacan. Masukkan kangkung dan cili, kacau cepat sampai layu.'},
  {id:'tauhu-goreng',n:'Tauhu Goreng Cili',e:'🧈',p:'sayur',s:'Goreng',m:15,ing:['Tauhu 3 keping','Tepung jagung','Garam','Cili kicap','Minyak'],st:'Potong tauhu dan salut tepung. Goreng sampai keemasan, hidangkan dengan cili kicap.'},
  {id:'ayam-rendang',n:'Ayam Rendang',e:'🍗',p:'ayam',s:'Kering',m:60,ing:['Ayam 1 ekor','Santan','Cili kering','Serai','Lengkuas','Daun limau purut','Asam keping'],st:'Rebus ayam dengan rempah dan santan. Kacau perlahan sampai kuah kering dan berminyak.'},
  {id:'daging-goreng-berempah',n:'Daging Goreng Berempah',e:'🥩',p:'daging',s:'Goreng',m:25,ing:['Daging hiris','Serbuk kari','Bawang putih','Halia','Tepung jagung','Minyak'],st:'Perap daging dengan rempah 20 min. Goreng dalam minyak panas sampai rangup.'},
  {id:'sate-daging',n:'Sate Daging',e:'🍢',p:'daging',s:'Bakar',m:40,ing:['Daging hiris','Kicap','Serbuk kunyit','Gula','Ketumbar','Kacang tanah untuk kuah'],st:'Perap daging dengan rempah, cucuk pada lidi. Bakar sambil sapu minyak, hidangkan dengan kuah kacang.'},
  {id:'ikan-bilis-sambal',n:'Ikan Bilis Sambal',e:'🐟',p:'ikan',s:'Kering',m:20,ing:['Ikan bilis 1 cawan','Cili kering','Bawang merah','Belacan','Asam jawa','Gula'],st:'Goreng ikan bilis sampai rangup. Tumis sambal, masukkan ikan bilis dan kacau sampai sambal kering.'},
  {id:'ikan-tumis-sambal',n:'Ikan Tumis Sambal',e:'🐠',p:'ikan',s:'Tumis',m:15,ing:['Ikan 300g','Sambal tumis','Bawang besar','Daun limau purut','Gula'],st:'Goreng ikan sekejap. Tumis sambal sampai pecah minyak, masukkan ikan dan kacau perlahan.'},
  {id:'sotong-kering-sambal',n:'Sotong Kering Sambal',e:'🦑',p:'seafood',s:'Kering',m:25,ing:['Sotong 300g','Cili kering','Bawang merah','Belacan','Gula','Asam jawa'],st:'Tumis sambal kering dengan belacan. Masukkan sotong dan kacau sampai kering dan sebati.'},
  {id:'sup-seafood',n:'Sup Seafood',e:'🍲',p:'seafood',s:'Berkuah',m:30,ing:['Udang 200g','Sotong 150g','Sayur campur','Bawang putih','Halia','Sos tiram','Kiub ayam'],st:'Tumis bawang putih dan halia. Masukkan air dan kiub ayam, masak sayur, kemudian masukkan seafood.'},
  {id:'udang-bakar',n:'Udang Bakar',e:'🦐',p:'seafood',s:'Bakar',m:15,ing:['Udang besar 300g','Mentega','Bawang putih','Lemon','Serbuk lada','Garam'],st:'Lumurkan udang dengan mentega dan bawang putih. Bakar sampai masak, hidangkan dengan perahan lemon.'},
  {id:'telur-sambal-kering',n:'Telur Sambal Kering',e:'🥚',p:'telur',s:'Kering',m:15,ing:['Telur rebus 4 biji','Cili kering','Bawang merah','Gula','Asam jawa','Minyak'],st:'Goreng telur sampai keemasan. Tumis sambal kering, gulingkan telur dalam sambal.'},
  {id:'telur-pindang',n:'Telur Pindang',e:'🥚',p:'telur',s:'Berkuah',m:25,ing:['Telur 4 biji','Kicap','Bawang putih','Serai','Lengkuas','Gula','Asam keping'],st:'Rebus telur sampai masak, kupas dan calar sedikit. Masak dalam kuah kicap dengan rempah sampai telur berwarna.'},
  {id:'tempeh-goreng-kering',n:'Tempeh Goreng Kering',e:'🟫',p:'sayur',s:'Kering',m:15,ing:['Tempeh 200g','Cili kering','Bawang putih','Gula','Garam','Minyak'],st:'Goreng tempeh sampai rangup. Tumis sambal kering, masukkan tempeh dan kacau sampai sebati.'},
  {id:'sayur-lemak-labu',n:'Sayur Lemak Labu',e:'🎃',p:'sayur',s:'Berkuah',m:25,ing:['Labu 300g','Santan','Kacang panjang','Udang kering','Cili padi','Bawang merah'],st:'Tumis bawang merah dan cili. Tuang santan dan air, masukkan labu sampai lembut, kemudian kacang panjang.'},
  {id:'jagung-bakar',n:'Jagung Bakar',e:'🌽',p:'sayur',s:'Bakar',m:15,ing:['Jagung 3 batang','Mentega','Gula','Garam','Sos cili'],st:'Bakar jagung sampai kekuningan. Sapu mentega, taburkan gula dan garam, hidangkan dengan sos cili.'}
];
const dishById=id=>MENU.find(d=>d.id===id);

/* ---------- STORAGE ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let favs=store.get('favs',[]);
let shop=store.get('shop',[]);

/* ---------- YOSHI ---------- */
function yoshi(size=120){
  return `<img class="yoshi" src="yoshi.jpg" alt="Yoshi, kucing hitam" width="${size}" height="${size}">`;
}

/* ---------- STATE ---------- */
const S={tab:'pilih',screen:'home',p:null,s:null,t:null,openId:null,spinning:false};
const $app=document.getElementById('app');

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);
}
function saveFavs(){store.set('favs',favs)}
function saveShop(){store.set('shop',shop)}

function filtered(){
  return MENU.filter(d=>
    (!S.p||d.p===S.p)&&
    (!S.s||d.s===S.s)&&
    (!S.t||TIME.find(x=>x.k===S.t).test(d.m))
  );
}

function countFor(p,s,t){
  return MENU.filter(d=>
    (!p||d.p===p)&&(!s||d.s===s)&&(!t||TIME.find(x=>x.k===t).test(d.m))
  ).length;
}

/* ---------- RENDER ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.tab==='pilih') renderPilih();
  else if(S.tab==='kegemaran') renderFavs();
  else renderShop();
}

function crumbs(step){
  const labels=['Bahan','Gaya','Masa','Menu'];
  return `<div class="crumbs">${labels.map((l,i)=>`<span class="${i===step?'on':''}">${i+1}. ${l}</span>`).join(' › ')}</div>`;
}

function renderPilih(){
  if(S.screen==='home'){
    $app.innerHTML=`
      <div class="hero">${yoshi(130)}
        <div class="bubble">Meow! Hari ni nak makan apa? 🍽️</div>
      </div>
      <h1 style="text-align:center;margin-top:10px">Nak Masak Apa?</h1>
      <p class="sub" style="text-align:center">Pilih bahan, pilih gaya, dan biar kami tolong pilihkan.</p>
      <div class="card"><button class="btn" data-act="start">Mula pilih 🐾</button></div>
      <div class="card" style="text-align:center">
        <p class="meta">Yoshi kata: makan kenyang, hati senang 😸</p>
      </div>`;
    return;
  }
  if(S.screen==='protein'){
    $app.innerHTML=`${crumbs(0)}<h2>Hari ni nak makan apa?</h2>
      <div class="grid">${PROTEIN.map(p=>`<button class="tile" data-act="pick-p" data-v="${p.k}"><span class="e">${p.e}</span>${p.label}</button>`).join('')}</div>
      <div style="margin-top:14px"><button class="btn ghost" data-act="any-p">🎲 Apa-apa pun boleh</button></div>`;
    return;
  }
  if(S.screen==='style'){
    $app.innerHTML=`${crumbs(1)}<h2>Gaya masakan?</h2>
      <div class="chips">
        <button class="chip ${!S.s?'sel':''}" data-act="pick-s" data-v="">Mana-mana</button>
        ${STYLE.filter(s=>countFor(S.p,s,null)>0).map(s=>`<button class="chip ${S.s===s?'sel':''}" data-act="pick-s" data-v="${s}">${s} (${countFor(S.p,s,null)})</button>`).join('')}
      </div>
      <div style="margin-top:16px"><button class="btn" data-act="go-time">Seterusnya 🐾</button></div>
      <div style="margin-top:10px"><button class="btn ghost" data-act="back">‹ Kembali</button></div>`;
    return;
  }
  if(S.screen==='time'){
    $app.innerHTML=`${crumbs(2)}<h2>Berapa lama nak masak?</h2>
      <div class="grid">
        ${TIME.filter(t=>countFor(S.p,S.s,t.k)>0).map(t=>`<button class="tile ${S.t===t.k?'sel':''}" data-act="pick-t" data-v="${t.k}"><span class="e">⏱️</span>${t.label}<div class="meta">${t.desc} · ${countFor(S.p,S.s,t.k)} menu</div></button>`).join('')}
        <button class="tile ${!S.t?'sel':''}" data-act="pick-t" data-v=""><span class="e">✨</span>Mana-mana</button>
      </div>
      <div style="margin-top:16px"><button class="btn" data-act="go-results">Tunjuk menu 😸</button></div>
      <div style="margin-top:10px"><button class="btn ghost" data-act="back">‹ Kembali</button></div>`;
    return;
  }
  if(S.screen==='results'){
    const list=filtered();
    $app.innerHTML=`${crumbs(3)}<h2>Pilihan kau (${list.length})</h2>
      ${list.length?`<div class="card"><button class="btn yellow" data-act="spin">🎰 Pilihkan untuk saya</button></div>`:''}
      ${list.length?list.map(d=>dishRow(d)).join(''):`<div class="card empty">${yoshi(100)}<p style="margin-top:8px">Tak jumpa menu yang sama. Cuba tukar pilihan.</p></div>`}
      <div style="margin-top:6px"><button class="btn ghost" data-act="restart">🔄 Mula semula</button></div>`;
    return;
  }
  if(S.screen==='detail'){
    const d=dishById(S.openId);
    if(!d){S.screen='home';return render()}
    const isFav=favs.includes(d.id);
    $app.innerHTML=`
      <div class="card" style="text-align:center">
        <div style="font-size:72px;line-height:1.1">${d.e}</div>
        <h2 style="margin:6px 0">${d.n}</h2>
        <p class="meta">${d.s} · ${d.m} min · ${PROTEIN.find(p=>p.k===d.p).label}</p>
        <div style="margin-top:10px" class="chips" >
          <button class="chip ${isFav?'sel':''}" data-act="fav" data-v="${d.id}">${isFav?'💖 Kegemaran':'🤍 Tambah kegemaran'}</button>
        </div>
      </div>
      <div class="card">
        <h2 style="font-size:19px">Bahan 🥕</h2>
        ${d.ing.map(i=>`<div class="ing"><span>•</span>${i}</div>`).join('')}
        <div style="margin-top:12px"><button class="btn alt small" data-act="add-shop" data-v="${d.id}">+ Masuk senarai beli 🛒</button></div>
      </div>
      <div class="card">
        <h2 style="font-size:19px">Cara masak 🍳</h2>
        <p class="steps">${d.st}</p>
      </div>
      <div><button class="btn ghost" data-act="back-results">‹ Kembali ke pilihan</button></div>`;
    return;
  }
}
function dishRow(d){
  const isFav=favs.includes(d.id);
  return `<div class="card row" style="padding:12px">
    <button class="tile" style="width:64px;padding:8px;box-shadow:none;border-width:2px" data-act="open" data-v="${d.id}"><span class="e" style="font-size:30px;margin:0">${d.e}</span></button>
    <div class="grow" data-act="open" data-v="${d.id}" style="cursor:pointer">
      <div class="dish-name">${d.n}</div>
      <div class="meta">${d.s} · ${d.m} min</div>
    </div>
    <button class="heart" data-act="fav" data-v="${d.id}" aria-label="Kegemaran">${isFav?'💖':'🤍'}</button>
  </div>`;
}

function renderFavs(){
  const list=favs.map(dishById).filter(Boolean);
  $app.innerHTML=`<h1>Kegemaran 💖</h1><p class="sub">Menu yang kau suka</p>
    ${list.length?list.map(d=>dishRow(d)).join(''):`<div class="card empty">${yoshi(100)}<p style="margin-top:8px">Belum ada kegemaran. Tekan 🤍 pada menu.</p></div>`}`;
}

function renderShop(){
  const done=shop.filter(x=>x.done).length;
  $app.innerHTML=`<h1>Senarai Beli 🛒</h1>
    <p class="sub">${shop.length?`${done}/${shop.length} dah ambil`:'Kosong lagi'}</p>
    ${shop.length?`<div class="card">${shop.map((x,i)=>`
      <div class="ing">
        <input type="checkbox" data-act="tick" data-v="${i}" ${x.done?'checked':''}>
        <span style="flex:1;${x.done?'text-decoration:line-through;color:var(--muted)':''}">${x.t}</span>
        <button class="heart" style="font-size:18px" data-act="del" data-v="${i}" aria-label="Buang">✖️</button>
      </div>`).join('')}</div>
      <button class="btn ghost" data-act="clear-shop">🧹 Kosongkan senarai</button>`
      :`<div class="card empty">${yoshi(100)}<p style="margin-top:8px">Tambah bahan dari resipi.</p></div>`}`;
}

/* ---------- ACTIONS ---------- */
function spin(){
  const list=filtered();
  if(!list.length||S.spinning)return;
  S.spinning=true;
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="card pop"><div class="spin-emoji" id="se">🎲</div><div class="spin-name" id="sn">...</div></div>`;
  document.body.appendChild(ov);
  const pick=list[Math.floor(Math.random()*list.length)];
  let ticks=0;const total=18;
  const timer=setInterval(()=>{
    const r=list[Math.floor(Math.random()*list.length)];
    document.getElementById('se').textContent=r.e;
    document.getElementById('sn').textContent=r.n;
    ticks++;
    if(ticks>=total){
      clearInterval(timer);
      document.getElementById('se').textContent=pick.e;
      document.getElementById('sn').textContent=pick.n;
      ov.querySelector('.card').insertAdjacentHTML('beforeend',`
        <div style="display:grid;gap:10px;margin-top:14px">
          <button class="btn" data-act="spin-open" data-v="${pick.id}">Tengok resipi 😸</button>
          <button class="btn ghost" data-act="spin-close">Tutup</button>
        </div>`);
      S.spinning=false;
    }
  },90);
  ov.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');
    if(!b)return;
    if(b.dataset.act==='spin-open'){S.openId=b.dataset.v;S.screen='detail';ov.remove();render();window.scrollTo(0,0)}
    if(b.dataset.act==='spin-close'){ov.remove()}
  });
  ov._timer=timer;
}

function handle(act,v,el){
  switch(act){
    case 'start': S.screen='protein'; break;
    case 'pick-p': S.p=v; S.screen='style'; break;
    case 'any-p': S.p=null; S.screen='style'; break;
    case 'pick-s': S.s=v||null; render(); return;
    case 'go-time':
      if(S.s && countFor(S.p,S.s,null)===0) S.s=null;
      S.screen='time'; break;
    case 'pick-t': S.t=v||null; render(); return;
    case 'go-results':
      if(S.t && countFor(S.p,S.s,S.t)===0) S.t=null;
      S.screen='results'; break;
    case 'back':
      S.screen = S.screen==='time'?'style':S.screen==='style'?'protein':'home';
      break;
    case 'restart': S.p=S.s=S.t=null; S.screen='home'; break;
    case 'spin': spin(); return;
    case 'open': S.openId=v; S.screen='detail'; window.scrollTo(0,0); break;
    case 'back-results': S.screen='results'; break;
    case 'fav':
      favs = favs.includes(v) ? favs.filter(x=>x!==v) : [...favs,v];
      saveFavs(); toast(favs.includes(v)?'Ditambah ke kegemaran 💖':'Dibuang dari kegemaran');
      break;
    case 'add-shop': {
      const d=dishById(v);
      let added=0;
      d.ing.forEach(i=>{ if(!shop.some(x=>x.t===i)){shop.push({t:i,done:false});added++} });
      saveShop(); toast(added?`+${added} bahan masuk senarai 🛒`:'Semua bahan dah ada 🛒');
      break;
    }
    case 'tick': shop[+v].done=!shop[+v].done; saveShop(); return;
    case 'del': shop.splice(+v,1); saveShop(); break;
    case 'clear-shop': if(confirm('Kosongkan senarai beli?')){shop=[];saveShop()} break;
  }
  render();
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const nav=e.target.closest('#nav button');
  if(nav){
    S.tab=nav.dataset.tab;
    if(S.tab==='pilih' && S.screen==='detail') S.screen='results';
    window.scrollTo(0,0);render();return;
  }
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.dataset.act==='fav' && S.screen!=='detail' && S.tab!=='pilih'){ /* fall through */ }
  const act=el.dataset.act;
  if(act==='tick')return;
  e.stopPropagation();
  handle(act,el.dataset.v,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act="tick"]');
  if(el){handle('tick',el.dataset.v,el)}
});

/* ---------- START ---------- */
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
